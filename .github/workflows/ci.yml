name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Pom.sln

      - name: Build
        run: dotnet build Pom.sln --no-restore --configuration Release

      - name: Test
        # Integration tests use Testcontainers, which needs Docker —
        # available by default on GitHub-hosted ubuntu-latest runners.
        run: dotnet test Pom.sln --no-build --configuration Release --logger "trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            **/*.trx
            **/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # The package script already invokes `vitest --run`; passing --run again
        # makes Vitest reject the duplicated boolean option.
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker image build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f src/Api/Dockerfile -t pom-api:ci .

      - name: Build web image
        run: docker build -f src/Web/Dockerfile -t pom-web:ci src/Web
